<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🤖</text></svg>">

  <style>
    :root { color-scheme: light dark; }
    body {
      font: 16px/1.5 system-ui, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    h1 { font-size: 1.3rem; }
    #log { display: flex; flex-direction: column; gap: .75rem; margin-bottom: 1rem; }
    .msg { padding: .6rem .9rem; border-radius: .6rem; white-space: pre-wrap; }
    .you { background: #0b6bcb; color: #fff; align-self: flex-end; max-width: 80%; }
    .jarvis { background: rgba(127,127,127,.15); align-self: flex-start; max-width: 80%; }
    .jarvis.error { background: rgba(220,50,50,.18); }
    form { display: flex; gap: .5rem; }
    textarea { flex: 1; font: inherit; padding: .5rem; resize: vertical; min-height: 3rem; }
    button { font: inherit; padding: 0 1.2rem; }
    .approvals { display: flex; flex-direction: column; gap: .4rem; }
    .approvals .row { display: flex; gap: .5rem; align-items: center; justify-content: space-between; }
    .mini { font-size: .8em; padding: .1rem .6rem; }
  </style>
</head>
<body>
  <h1>Jarvis</h1>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Ask Jarvis&hellip;" autofocus></textarea>
    <button type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.append(div);
      div.scrollIntoView();
      return div;
    }

    // A "Copy" button so Ben can lift a drafted reschedule message straight
    // out of Jarvis's reply.
    function addCopyButton(div, text) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mini";
      btn.textContent = "Copy";
      btn.addEventListener("click", () => navigator.clipboard.writeText(text));
      div.append(" ", btn);
    }

    // Foreign-event changes Jarvis proposed but didn't apply. One Approve
    // button each; approving POSTs to /apply, which does the actual write.
    function renderApprovals(items) {
      const box = document.createElement("div");
      box.className = "msg jarvis approvals";
      box.innerHTML = "<strong>Needs your approval:</strong>";
      for (const item of items) {
        const row = document.createElement("div");
        row.className = "row";
        const label = document.createElement("span");
        label.textContent = item.label;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "mini";
        btn.textContent = "Approve";
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          btn.textContent = "…";
          try {
            const res = await fetch("/apply", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(item),
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            btn.textContent = "Approved ✓";
          } catch (err) {
            btn.disabled = false;
            btn.textContent = "Retry (" + err.message + ")";
          }
        });
        row.append(label, btn);
        box.append(row);
      }
      log.append(box);
      box.scrollIntoView();
    }

    // Session memory: the browser holds the conversation and replays it each
    // call. Lives as long as the page is open (reload clears it).
    const history = [];

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add(message, "you");
      input.value = "";
      const bubble = add("…", "jarvis");
      try {
        // Same origin as this page, so no CORS. history gives Jarvis memory of
        // earlier turns this session. The response streams one NDJSON line per
        // tool call, then a final line with the reply — lets the bubble show
        // "Using <tool>…" while Jarvis is still working.
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let data = null;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop(); // last element may be a partial line
          for (const line of lines) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.type === "tool") {
              bubble.textContent = "Using " + event.name + "…";
            } else if (event.type === "final") {
              data = event;
            }
          }
        }

        bubble.textContent = data.reply;
        addCopyButton(bubble, data.reply);
        if (data.pending && data.pending.length) renderApprovals(data.pending);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        bubble.textContent = "Error: " + err.message;
        bubble.classList.add("error");
      }
    });

    // Enter sends, Shift+Enter for newline.
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
