<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS</title>
  <!-- Arc-reactor favicon, drawn inline so it scales and needs no asset -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2303070d'/><circle cx='16' cy='16' r='10' fill='none' stroke='%232f8fc4' stroke-width='2'/><circle cx='16' cy='16' r='6' fill='none' stroke='%235fe3ff' stroke-width='2' stroke-dasharray='20 8'/><circle cx='16' cy='16' r='2.5' fill='%23e8fbff'/></svg>">

  <!-- HUD faces: Orbitron for the wordmark/headers, JetBrains Mono for chrome/data.
       Robust monospace fallback if offline, so the look never silently breaks. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ===== Jarvis Interface Design System — Mark I (committed dark HUD) ===== */
    :root {
      --void:      #03070d;
      --void-2:    #061019;
      --panel:     #08151f;
      --line:      #123246;
      --line-hot:  #1d4e6b;

      --cyan:      #5fe3ff;
      --cyan-deep: #2f8fc4;
      --cyan-dim:  #3a6f8a;
      --holo:      #e8fbff;
      --gold:      #ffb547;
      --gold-dim:  #b9823a;
      --alert:     #ff5d4a;

      --ink:       #cfeefc;
      --ink-mute:  #6f92a6;
      --ink-faint: #3f5c6d;

      --font-hud:  "Orbitron", ui-monospace, "SF Mono", "JetBrains Mono", monospace;
      --font-data: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code", monospace;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

      --glow-cyan: 0 0 6px rgba(95,227,255,.55), 0 0 22px rgba(95,227,255,.22);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(1100px 640px at 50% -10%, #0a2233 0%, transparent 60%),
        radial-gradient(800px 800px at 100% 100%, #071a24 0%, transparent 55%),
        var(--void);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient HUD grid + faint scanline, behind everything */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(47,143,196,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(47,143,196,.05) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(120% 95% at 50% 15%, #000 40%, transparent 100%);
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(3,7,13,0) 0 2px, rgba(3,7,13,.3) 3px);
      opacity: .3;
    }

    .app {
      position: relative; z-index: 1;
      max-width: 820px; margin: 0 auto; min-height: 100%;
      display: flex; flex-direction: column;
      padding: 20px 20px 0;
    }

    /* ===== Header ===== */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 6px 4px 16px;
      border-bottom: 1px solid var(--line);
    }
    .mark { width: 40px; height: 40px; flex: none; }
    .mark svg { width: 100%; height: 100%; overflow: visible; }

    /* Shared ring rig — same markup/classes drive the header mark (40px) and
       the bubble's calculating indicator (22px); only the container size
       differs, so the two always read as one animation. */
    .ring-spin-slow { transform-origin: 20px 20px; animation: spin 8s linear infinite; }
    .ring-spin-fast { transform-origin: 20px 20px; animation: spin 1.6s linear infinite; }
    .ring-spin-rev  { transform-origin: 20px 20px; animation: spin 2.4s linear infinite reverse; }
    .ring-pulse     { animation: pulse-core 1.6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse-core { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    h1 {
      margin: 0; font-family: var(--font-hud); font-weight: 700;
      font-size: 1.5rem; letter-spacing: .34em; color: var(--holo);
      text-shadow: var(--glow-cyan); line-height: 1;
    }
    .sub { font-family: var(--font-data); font-size: .58rem; letter-spacing: .28em; text-transform: uppercase; color: var(--cyan-dim); }
    .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-family: var(--font-data); font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); }
    .status .led { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: var(--glow-cyan); animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

    /* ===== Chat log ===== */
    #log {
      flex: 1;
      display: flex; flex-direction: column; gap: 14px;
      padding: 22px 4px;
      overflow-y: auto;
    }
    .msg {
      max-width: 82%; padding: 11px 14px; border-radius: 10px;
      white-space: pre-wrap; word-wrap: break-word;
      font-size: .96rem; line-height: 1.55;
      animation: rise .28s ease-out both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg .who {
      font-family: var(--font-data); font-size: .55rem; letter-spacing: .2em;
      text-transform: uppercase; margin-bottom: 5px; opacity: .85;
    }
    .msg.jarvis {
      align-self: flex-start;
      background: linear-gradient(180deg, rgba(18,50,70,.55), rgba(8,21,31,.55));
      border: 1px solid var(--line-hot); border-left: 2px solid var(--cyan);
      box-shadow: 0 0 18px rgba(95,227,255,.06);
    }
    .msg.jarvis .who { color: var(--cyan); }
    /* Jarvis speaks in the HUD's data face, matching the iOS bubble's
       JetBrains Mono body text — the user's own side stays system-sans. */
    .msg.jarvis .body { font-family: var(--font-data); font-size: .82rem; }
    .msg.you {
      align-self: flex-end;
      background: linear-gradient(180deg, rgba(60,40,10,.42), rgba(28,20,6,.42));
      border: 1px solid var(--gold-dim); border-right: 2px solid var(--gold);
      color: #ffe6bd;
    }
    .msg.you .who { color: var(--gold); }
    .msg.jarvis.error {
      border-color: var(--alert); border-left-color: var(--alert);
      background: rgba(255,93,74,.12); color: #ffd9d3;
    }
    .msg.jarvis.error .who { color: var(--alert); }

    /* Calculating ring — replaces the plain "…" while Jarvis thinks */
    .calc { display: flex; align-items: center; gap: 11px; color: var(--cyan-dim); font-family: var(--font-data); font-size: .82rem; letter-spacing: .04em; }
    .calc .ring { width: 22px; height: 22px; flex: none; }
    .calc .ring svg { width: 100%; height: 100%; overflow: visible; }
    .calc .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

    /* ===== Composer ===== */
    form {
      display: flex; gap: 10px; align-items: flex-end;
      padding: 14px 0 20px;
      border-top: 1px solid var(--line);
      background: linear-gradient(180deg, transparent, var(--void) 40%);
      position: sticky; bottom: 0;
    }
    textarea {
      flex: 1; font-family: var(--font-data); font-size: .9rem; color: var(--ink);
      background: var(--void-2); border: 1px solid var(--line-hot); border-radius: 6px;
      padding: 11px 13px; resize: vertical; min-height: 3.1rem; line-height: 1.5;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea::placeholder { color: var(--ink-faint); }
    textarea:focus { outline: none; border-color: var(--cyan); box-shadow: var(--glow-cyan); }
    button {
      font-family: var(--font-hud); font-weight: 500; font-size: .72rem;
      letter-spacing: .18em; text-transform: uppercase; color: var(--void);
      background: var(--cyan); border: 0; border-radius: 6px;
      padding: 0 1.4rem; min-height: 3.1rem; cursor: pointer;
      box-shadow: var(--glow-cyan); transition: filter .15s, transform .05s;
    }
    button:hover { filter: brightness(1.12); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; filter: none; }

    /* Smaller inline buttons: Copy on a reply, Approve in the approvals box */
    button.mini { font-size: .62rem; letter-spacing: .12em; padding: .35rem .9rem; min-height: 0; margin-left: 10px; }

    .msg.approvals { display: flex; flex-direction: column; gap: 10px; }
    .msg.approvals strong {
      font-family: var(--font-data); font-size: .58rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--cyan);
    }
    .msg.approvals .row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; padding: 6px 2px;
    }

    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="mark" id="headerMark" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="17" fill="none" stroke="#123246" stroke-width="2"/>
          <g class="ring-spin-slow">
            <circle cx="20" cy="20" r="17" fill="none" stroke="#2f8fc4" stroke-width="2" stroke-dasharray="46 20"/>
            <circle cx="20" cy="20" r="11" fill="none" stroke="#5fe3ff" stroke-width="2" stroke-dasharray="30 22"/>
          </g>
          <circle cx="20" cy="20" r="3.5" fill="#e8fbff"/>
        </svg>
      </div>
      <div class="brand">
        <h1>JARVIS</h1>
        <span class="sub">Interface // Mark I</span>
      </div>
      <div class="status"><span class="led"></span>Online</div>
    </header>

    <div id="log"></div>

    <form id="form">
      <textarea id="input" placeholder="Ask Jarvis&hellip;" autofocus></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const headerMark = document.getElementById("headerMark");

    // The three rings the header mark and the bubble's calculating indicator
    // both draw from — "thinking" while Jarvis is reasoning, "processing"
    // once it's actually mid tool-call, "standby" otherwise. Same viewBox for
    // all three so a single set of ring-spin-* classes drives every size.
    function ringSVG(kind) {
      if (kind === "thinking") {
        return '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="#123246" stroke-width="2.5"/>' +
          '<g class="ring-spin-fast"><circle cx="20" cy="20" r="15" fill="none" stroke="#5fe3ff" stroke-width="2.5" stroke-dasharray="28 66" stroke-linecap="round"/></g>' +
          '<circle cx="20" cy="20" r="3" fill="#5fe3ff" class="ring-pulse"/></svg>';
      }
      if (kind === "processing") {
        return '<svg viewBox="0 0 40 40">' +
          '<g class="ring-spin-fast"><circle cx="20" cy="20" r="15" fill="none" stroke="#5fe3ff" stroke-width="2" stroke-dasharray="40 55" stroke-linecap="round"/></g>' +
          '<g class="ring-spin-rev"><circle cx="20" cy="20" r="10.5" fill="none" stroke="#2f8fc4" stroke-width="2" stroke-dasharray="20 33"/></g>' +
          '<circle cx="20" cy="20" r="6" fill="none" stroke="#ffb547" stroke-width="1.5" opacity=".7"/>' +
          '<circle cx="20" cy="20" r="2.2" fill="#e8fbff" class="ring-pulse"/></svg>';
      }
      return '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#123246" stroke-width="2"/>' +
        '<g class="ring-spin-slow"><circle cx="20" cy="20" r="17" fill="none" stroke="#2f8fc4" stroke-width="2" stroke-dasharray="46 20"/>' +
        '<circle cx="20" cy="20" r="11" fill="none" stroke="#5fe3ff" stroke-width="2" stroke-dasharray="30 22"/></g>' +
        '<circle cx="20" cy="20" r="3.5" fill="#e8fbff"/></svg>';
    }

    // Wraps a ring in the 22px bubble-sized container.
    function ringHTML(kind) {
      return '<span class="ring">' + ringSVG(kind) + '</span>';
    }

    // Keeps the header mark showing the same tier the active bubble is on —
    // there's only ever one request in flight, so this is a direct mirror,
    // not a separate state machine.
    function setHeaderActivity(kind) {
      headerMark.innerHTML = ringSVG(kind);
    }

    // Escapes HTML first, then turns **bold** into <strong> — the only
    // markdown Jarvis's replies tend to use. Never applied to what the user
    // typed, so literal asterisks in your own messages stay literal.
    function renderMarkdown(text) {
      const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = cls === "you" ? "You" : "Jarvis";
      const body = document.createElement("div");
      body.className = "body";
      if (cls === "you") {
        body.textContent = text;
      } else {
        body.innerHTML = renderMarkdown(text);
      }
      div.append(who, body);
      log.append(div);
      div.scrollIntoView();
      return body; // return the text node holder so callers can update it
    }

    function addCalculating() {
      const div = document.createElement("div");
      div.className = "msg jarvis";
      div.innerHTML = '<div class="who">Jarvis</div><div class="calc">' + ringHTML("thinking") + '<span>Calculating<span class="dots"></span></span></div>';
      log.append(div);
      div.scrollIntoView();
      return div;
    }

    // A "Copy" button so Ben can lift a drafted reschedule message straight
    // out of Jarvis's reply.
    function addCopyButton(div, text) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mini";
      btn.textContent = "Copy";
      btn.addEventListener("click", () => navigator.clipboard.writeText(text));
      div.append(" ", btn);
    }

    // Changes Jarvis proposed but didn't apply (foreign-event edits, or invites
    // to other people). The server persists the outstanding set and returns the
    // full list every turn, so we reconcile rows by id: new ones are added,
    // ones that were approved or cancelled elsewhere drop out. One Approve
    // button each; approving POSTs to /apply, which does the actual write.
    let approvalsBox = null;
    const approvalRows = new Map(); // id -> row element

    function makeApprovalRow(item) {
      const row = document.createElement("div");
      row.className = "row";
      const label = document.createElement("span");
      label.textContent = item.label;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mini";
      btn.textContent = "Approve";
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "…";
        try {
          const res = await fetch("/apply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(item),
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          // Applied server-side and dropped from the queue — remove the row.
          approvalRows.delete(item.id);
          row.remove();
          if (approvalsBox && !approvalRows.size) {
            approvalsBox.remove();
            approvalsBox = null;
          }
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Retry (" + err.message + ")";
        }
      });
      row.append(label, btn);
      return row;
    }

    function renderApprovals(items) {
      const ids = new Set(items.map((i) => i.id));
      for (const [id, row] of approvalRows) {
        if (!ids.has(id)) {
          row.remove();
          approvalRows.delete(id);
        }
      }
      if (!items.length) {
        if (approvalsBox) {
          approvalsBox.remove();
          approvalsBox = null;
        }
        return;
      }
      if (!approvalsBox) {
        approvalsBox = document.createElement("div");
        approvalsBox.className = "msg jarvis approvals";
        approvalsBox.innerHTML = "<strong>Needs your approval:</strong>";
      }
      log.append(approvalsBox); // keep it at the bottom of the log
      for (const item of items) {
        if (approvalRows.has(item.id)) continue;
        const row = makeApprovalRow(item);
        approvalRows.set(item.id, row);
        approvalsBox.append(row);
      }
      approvalsBox.scrollIntoView();
    }

    // Session memory: the browser holds the conversation and replays it each
    // call. Lives as long as the page is open (reload clears it).
    const history = [];

    function greeting() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const stamp = `${pad(now.getHours())}:${pad(now.getMinutes())} on ${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()}`;
      const hour = now.getHours();
      const part = hour < 12 ? "this morning" : hour < 18 ? "today" : "this evening";
      return `Hi Ben, it's ${stamp}. How can I help you ${part}?`;
    }
    add(greeting(), "jarvis");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add(message, "you");
      input.value = "";
      const pending = addCalculating();
      setHeaderActivity("thinking");
      try {
        // Same origin as this page, so no CORS. history gives Jarvis memory of
        // earlier turns this session. The response streams one NDJSON line per
        // tool call, then a final line with the reply — lets the bubble show
        // "Calling <tool>…" while Jarvis is still working.
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let data = null;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop(); // last element may be a partial line
          for (const line of lines) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.type === "tool") {
              pending.innerHTML =
                '<div class="who">Jarvis</div><div class="calc">' + ringHTML("processing") +
                '<span>Calling &lt;' + event.name + '&gt;<span class="dots"></span></span></div>';
              setHeaderActivity("processing");
            } else if (event.type === "final") {
              data = event;
            }
          }
        }

        pending.innerHTML = '<div class="who">Jarvis</div>';
        const body = document.createElement("div");
        body.className = "body";
        body.innerHTML = renderMarkdown(data.reply);
        pending.append(body);
        if (data.is_draft) addCopyButton(body, data.reply);
        pending.scrollIntoView();
        renderApprovals(data.pending || []);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        pending.classList.add("error");
        pending.innerHTML = '<div class="who">System</div>';
        const body = document.createElement("div");
        body.textContent = "Error: " + err.message;
        pending.append(body);
      } finally {
        setHeaderActivity("standby");
      }
    });

    // Enter sends, Shift+Enter for newline.
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
