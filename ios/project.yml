name: Jarvis
options:
  bundleIdPrefix: com.bmolyneaux
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Jarvis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bmolyneaux.jarvis
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 749Y7LB6WB
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
    info:
      path: Jarvis/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # Pi backend is plain HTTP over the private tailnet, so allow it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # For the current_location tool (route planning "from here"), used only
        # while the app is open to attach a fix to the outgoing chat message.
        NSLocationWhenInUseUsageDescription: >-
          Jarvis uses your current location for route planning when you ask
          questions like "how long to get home from here".
        # Jarvis Interface (Mark I) HUD faces — see DESIGN.md visual identity.
        UIAppFonts:
          - Orbitron-Medium.ttf
          - Orbitron-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
